project: frontend-portfolio-site
type: technical-research
status: draft
sections:
  - id: 1
    title: "Contexto del proyecto"
    body: |
      1.1. Identidad del proyecto

      - Nombre del proyecto: `frontend-portfolio-site`.
      - Tipo: frontend web de portfolio personal / profesional.
      - Dominio funcional: presentación de perfil/bio, experiencia laboral y académica, proyectos, artículos/blog y puntos de contacto.

      1.2. Objetivo técnico actual

      - Servir como portfolio moderno con navegación fluida (App Router + animaciones) y una integración limpia con un backend Rails (REST) cuando se desactiven los mocks.
      - Estado brownfield: existe código funcional con varias integraciones (Redux, React Query, animaciones, diseño) y deuda técnica reconocida (posibles malas prácticas en integraciones, bugs y estilos inconsistentes).

      1.3. Stack tecnológico clave

      - Framework: Next.js 14 (App Router, `src/app/...`).
      - Librerías principales:
        - React 18.
        - @tanstack/react-query v5 (+ devtools) para server state.
        - Redux Toolkit + react-redux para UI/client state (paneles, tema, clipboard).
        - zod para validación de datos (ya aplicado en `profile`, pendiente en otros dominios).
        - framer-motion para animaciones.
      - Styling & diseño:
        - Tailwind CSS + `globals.css`.
        - Atomic Design: `src/ui/{atoms,molecules,organisms,overlays}`.
      - Backend & datos:
        - Cliente HTTP custom: `src/lib/httpRequest` + `config`.
        - Arquitectura de dominios DDD en `src/domains/*` con `model`, `queries` y `mutations`.
        - Actualmente el sistema funciona en modo mocks para datos, con una capa pensada para cambiar a API real.

      1.4. Arquitectura de alto nivel (resumen)

      - App Router (`src/app/layout.jsx`) define RootLayout con RootProvider, NavBar, AnimatedChildren y Footer.
      - Capa de datos basada en dominios + React Query, expuestos vía `@/hooks`.
      - Estado de UI en Redux (chatPanel, menuPanel, themeMode, emailClipboard).
      - UI organizada por atomic design (átomos, moléculas, organismos, overlays).

      1.5. Estado actual tras los últimos fixes

      - Se corrigió un bug en el dominio Article (`fetchById` inexistente).
      - Se corrigieron problemas claros en Redux (`menuPanel.toggle` y `themeMode.setThemeMode`).
      - Se introdujo validación con zod en el dominio `profile` como primer paso hacia una capa de datos más robusta.
  - id: 2
    title: "Arquitectura detallada del frontend"
    body: |
      2.1. Entry point y layout global

      - Archivo clave: `src/app/layout.jsx`.
      - Rol: punto de entrada de App Router, aplicación de estilos globales, fuente, RootProvider y layout principal con `NavBar`, `AnimatedChildren` y `Footer`.
      - Consecuencia arquitectónica: toda la aplicación cliente vive bajo un único árbol de providers consistente.

      2.2. Jerarquía de providers (estado y tema)

      - `RootProvider` envuelve la app con:
        1. `ReduxProvider` (inyecta `ReduxStore`).
        2. `ReactQueryProvider` (`QueryClientProvider` + Devtools en desarrollo).
        3. `ThemeProvider` (sincroniza `themeMode` de Redux con la clase `dark` en `document.documentElement`).
      - Esto consolida la separación entre UI/client state (Redux) y server state (React Query), con un único punto de configuración.

      2.3. Capa de datos: dominios DDD + React Query

      - Directorio: `src/domains`.
      - Cada dominio (`profile`, `project`, `article`, `job-experience`, etc.) sigue el patrón:
        - `model/` (lógica de acceso a datos, mocks y HTTP).
        - `schema.js` (zod; implementado en `profile`, pendiente en otros dominios).
        - `queries/` (hooks `useX`, `useXs` basados en React Query).
        - `mutations/` (cuando aplique).
      - Modelos implementan un patrón común:
        - `ENDPOINT` por dominio (`profiles`, `projects`, `articles`, ...).
        - Métodos como `fetchAll` y `fetchById` con parámetro `useMockFallback`.
        - Cuando `useMockFallback` es `true`, retornan datos de `mock.js` con delays simulados.
        - Cuando es `false`, usan `httpRequest` contra el backend Rails.
      - Hooks de React Query (`useProfile`, `useProjects`, `useArticles`, etc.) delegan en el modelo y configuran `queryKey`, `staleTime` y `cacheTime`.
      - Un agregador de hooks en `src/hooks/domains/index.js` expone todos los hooks de dominio vía `@/hooks`.

      2.4. Cliente HTTP y estrategia de mocks

      - `src/lib/httpRequest/config.js` define `API_URL` a partir de `NEXT_PUBLIC_API_HOST`, `NEXT_PUBLIC_BACKEND_PORT`, versión y path de módulo `site`.
      - `src/lib/httpRequest/index.js` implementa un helper `httpRequest(endpoint, api_url?, options?)` con:
        - Soporte de token opcional (`options.token` o `localStorage.auth_token`).
        - Manejo de errores HTTP (lanza `Error` con código y cuerpo textual cuando `!response.ok`).
        - Devolución de `response.json()` en casos de éxito.
      - `USE_MOCKS = true` en este helper provoca que, en modo mock global, se lance una excepción `MOCK_MODE_ENABLED` antes de hacer la petición real.
      - A nivel de arquitectura, la selección mocks/API se hace combinando:
        - El flag `useMockFallback` en cada modelo de dominio.
        - El flag global `USE_MOCKS` en el cliente HTTP.

      2.5. Estado de UI con Redux Toolkit

      - Directorio: `src/state`.
      - `ReduxStore` combina los reducers:
        - `chatPanel` (estado de apertura del panel de chat).
        - `emailClipboard` (si el email está copiado o no).
        - `menuPanel` (estado de apertura del menú, útil en responsive).
        - `themeMode` (modo `light/dark`).
      - Slices usan `createSlice` de Redux Toolkit y exponen acciones como `open`, `close`, `toggle`, además de setters explícitos.
      - Hooks `useAppDispatch` y `useAppSelector` en `src/hooks/store` envuelven `useDispatch`/`useSelector` para tipado y DX.
      - Arquitectónicamente, Redux se reserva para estado de interfaz y no almacena datos de negocio.

      2.6. UI con Atomic Design y consumo de datos

      - Directorio: `src/ui`.
      - Niveles:
        - `atoms/` (elementos básicos: botones, links, textos, iconos, etc.).
        - `molecules/` (combinaciones simples como `ExtraInfo`, `Logo`).
        - `organisms/` (componentes complejos: `NavBar`, `Menu`, `MenuFloating`, `Footer`, `Chat`, `Biography`, `ExperienceStats`, `Skills`, `Experiences`, `Academics`, `Hiring`, etc.).
        - `overlays/` (modales y overlays, aún no analizados en profundidad).
      - Patrones típicos en organismos que consumen datos:
        - Marcan `"use client"` cuando gestionan estado/hook en cliente.
        - Importan hooks desde `@/hooks` para obtener datos de dominios.
        - Gestionan `isLoading`/`isError` de React Query, mostrando skeletons o mensajes de error cuando corresponde.
        - Delegan la presentación en moléculas y átomos.

      2.7. Rutas y relación con dominios

      - Directorio: `src/app`.
      - Páginas principales: `/` (home), `/about`, `/projects`, `/articles`, `/coming-soon`.
      - Cada página compone organismos que:
        - consumen hooks de dominio para datos (por ejemplo, `useExperienceStats`, `useProjects`, `useArticles`).
        - pueden consultar slices de Redux para comportamiento de UI (menú, tema, chat).
      - El flujo estándar es:
        Ruta → Layout global → Organismos → Hooks de dominio + Redux → Modelos → httpRequest / mocks.
  - id: 4
    title: "Recomendaciones y plan de acción"
    body: |
      4.1. Vista general de prioridades

      - Quick wins (bajo esfuerzo, alto impacto local):
        1. Extender zod a 2–3 dominios clave más.
        2. Simplificar y documentar el uso de mocks vs API real.
        3. Limpiar side-effects en Redux (empezando por `themeMode`).
        4. Añadir 2–3 tests unitarios básicos para modelos/hooks y slices críticos.
      - Iniciativas de nivel medio:
        5. Definir una convención clara de estilos y empezar por los organismos más usados.
        6. Especificar una estrategia Server Components / Client Components para las páginas principales.
      - Iniciativas de nivel mayor (progresivas):
        7. Tipado más fuerte extremo a extremo (TS + zod en dominios relevantes).
        8. Refuerzo de a11y y UX (patrones sistemáticos de accesibilidad, mensajes de error, foco, etc.).

      4.2. Capa de datos: zod + mocks + httpRequest

      - Objetivo: elevar la robustez de la data layer sin romper la ergonomía actual.
      - Recomendaciones:
        - Extender zod a dominios clave (`project`, `article`, `experience-stat`): definir schemas en `model/schema.js` y usarlos en `fetchAll`/`fetchById`.
        - Clarificar la estrategia de mocks/API:
          - Definir una env var (`NEXT_PUBLIC_USE_MOCKS`) como fuente de verdad.
          - Documentar el comportamiento esperado en desarrollo vs producción.
        - Añadir tests básicos para modelos/hooks (por ejemplo, `Article.fetchById` y un hook como `useProjects`).

      4.3. Capa de estado de UI (Redux)

      - Objetivo: endurecer la capa de UI state y reducir sorpresas.
      - Recomendaciones:
        - Separar side-effects de la lógica de reducers, empezando por `themeMode` (mover DOM/localStorage a `ThemeProvider` o hooks dedicados).
        - Añadir tests mínimos para slices críticos (`menuPanel`, `themeMode`).
        - Documentar explícitamente que Redux se reserva para estado de interfaz y no para datos de backend.

      4.4. Next 14 / App Router: estrategia de rendering

      - Objetivo: aprovechar mejor las capacidades modernas de Next sin sobrecomplicar.
      - Recomendaciones:
        - Mapear para cada página qué partes deben ser client components y cuáles podrían ser server components.
        - Evaluar en el futuro SSR/streaming selectivo para páginas donde aporte valor (por ejemplo, la landing principal).

      4.5. UI/UX y estilos

      - Objetivo: reducir ruido visual/técnico y hacer más mantenible la capa de presentación.
      - Recomendaciones:
        - Definir una convención de estilos (p. ej., Tailwind como base + CSS modules puntuales) y aplicarla gradualmente empezando por `NavBar`, `Menu` y `Footer`.
        - Revisar duplicidades de clases y unificar patrones de espaciado, tipografía y estados hover/focus al tocar organismos.
        - Introducir un primer checklist de accesibilidad (focus visible, `aria-*` básicos en componentes interactivos clave, contraste suficiente).

      4.6. Documentación y ergonomía de desarrollo

      - Objetivo: que el proyecto sea fácil de retomar y extender.
      - Recomendaciones:
        - Mantener vivo `docs/technical-research-frontend-portfolio-site.yaml` como fuente de verdad de decisiones técnicas.
        - Añadir mini README por dominio crítico (`profile`, `project`, `article`) describiendo propósito, fuentes de datos y hooks principales.
        - Crear un pequeño checklist de PR interno: zod en nuevos modelos, ausencia de side-effects en nuevos reducers, decisión explícita client/server para nuevas páginas.
        - consumen hooks de dominio para datos (por ejemplo, `useExperienceStats`, `useProjects`, `useArticles`).
        - pueden consultar slices de Redux para comportamiento de UI (menú, tema, chat).
      - El flujo estándar es:
        Ruta → Layout global → Organismos → Hooks de dominio + Redux → Modelos → httpRequest / mocks.
  - id: 5
    title: "Plan de pruebas mínimas y estilos UI"
    body: |
      5.1. Plan de pruebas mínimas (modelos y slices críticos)

      - Objetivos:
        - Detectar regresiones básicas en la capa de datos y estado de UI.
        - Validar que los contratos zod y los hooks/modelos se comportan como se espera.
        - Cubrir los bugs ya encontrados para que no vuelvan.
      - Alcance inicial recomendado:
        - Modelos de dominio:
          - `domains/article/model` → `fetchAll` y `fetchById` (mocks + zod + selección por `id`).
          - `domains/project/model` → `fetchAll` (mocks + zod + fallback a API).
        - Hooks de dominio:
          - `useProjects` y `useArticles` en entorno mock (asegurar shape de retorno y manejo de errores simples).
        - Slices Redux:
          - `menuPanel` → comportamiento de `open`, `close`, `toggle`.
          - `themeMode` → estados de `setDark`, `setLight`, `toggle` sobre el `mode` (sin side-effects de DOM/localStorage).
      - Enfoque técnico sugerido:
        - Introducir una herramienta de test (Jest o Vitest) a nivel de repo.
        - Tests unitarios de funciones puras (reducers, modelos con mocks controlados).
        - Tests de hooks opcionales usando una librería tipo `@testing-library/react` en una fase posterior.
      - Criterio de "mínimo aceptable":
        - Al menos 1–2 tests por modelo/hook/slice crítico para cubrir los caminos principales.
        - Repetir el patrón cuando se añadan nuevos dominios o slices.

      5.2. Plan de estilos y Atomic UI

      - Objetivos:
        - Reducir la mezcla desordenada de `styles.css`, `globals.css` y Tailwind.
        - Hacer que los organismos más visibles sean fáciles de mantener y extender.
      - Convención propuesta:
        - Usar Tailwind CSS como base para layout, espaciado y tipografía global.
        - Reservar `styles.css`/CSS modules para casos específicos (animaciones complejas, componentes muy personalizados).
      - Fases:
        1. Auditoría ligera de componentes clave:
           - `NavBar`, `Menu`, `MenuFloating`, `Footer`, `ExperienceStats`.
           - Listar duplicidades de clases, patrones de layout repetidos y reglas que podrían ser Tailwind.
        2. Refactor incremental:
           - Cuando se toque uno de estos organismos, aprovechar para:
             - Mover estilos genéricos a Tailwind (clases utilitarias).
             - Simplificar o agrupar reglas CSS locales.
             - Alinear nombres de clases con una convención (`layout_*`, `component_*`, etc.).
        3. Checklist de UX/a11y al tocar UI:
           - Verificar estados `:hover`, `:focus` y `:active` coherentes.
           - Confirmar contraste mínimo en textos principales.
           - Añadir `aria-*` y roles semánticos donde falten (botones, enlaces de menú, diálogo de chat, etc.).
      - Resultado esperado:
        - Una capa UI donde los organismos principales tengan estilos coherentes y sean fáciles de evolucionar.
        - Un camino claro para seguir homogeneizando el resto de componentes con el tiempo.
  - id: 3
    title: "Análisis técnico / comparativo"
    body: |
      3.1. Visión general frente a prácticas modernas

      - Puntos alineados con buenas prácticas actuales:
        - Uso de Next.js 14 con App Router y layout raíz bien definido.
        - Separación clara entre server state (React Query) y UI/client state (Redux Toolkit).
        - Arquitectura basada en dominios (`src/domains`) y atomic design en UI.
        - Introducción de zod para validar datos en el dominio `profile`.
      - Puntos con riesgo o gap respecto a proyectos actuales:
        - Validación con zod solo aplicada a un dominio; el resto sigue en crudo.
        - Estrategia de mocks y http client algo dual (flag global + flag por dominio).
        - Errores previos en slices de Redux muestran que la capa de UI state aún no se ha endurecido del todo.

      3.2. Capa de datos y estado (React Query + Redux)

      - Fortalezas:
        - Responsabilidad bien separada: datos de negocio en React Query, estado de interfaz en Redux.
        - Patrón de modelo consistente con `fetchAll`/`fetchById` y `useMockFallback`.
        - Agregador de hooks en `@/hooks` que simplifica el consumo en UI.
      - Debilidades / riesgos:
        - Validación de datos inconsistente: solo `profile` valida con zod.
        - Combinación de `useMockFallback` y `USE_MOCKS` puede producir configuraciones ambiguas en el paso a producción.
        - El bug previo de `Article.fetchById` indica falta de tests / chequeos de API entre modelos y hooks.

      3.3. Dominio y modelos (DDD light)

      - Fortalezas:
        - Cada dominio tiene su carpeta con `model`, `mock`, `schema`, `queries`, `mutations`.
        - Los mocks reflejan bien el shape de los datos y sirven como plantilla para el backend Rails.
      - Debilidades / oportunidades:
        - zod aún no se usa como contrato único de verdad en todos los dominios.
        - Mezcla de TS/JS: índices en `.ts`, implementación en `.js`, sin tipado extremo a extremo.
        - Falta de documentación ligera por dominio (README, comentarios JSDoc/TSdoc).

      3.4. UI & Routing (Next 14 + Atomic)

      - Fortalezas:
        - Atomic design bien aplicado: organismos consumen datos y delegan en moléculas/átomos.
        - App Router con layout global que centraliza providers, navegación, footer y animaciones.
      - Debilidades / riesgos:
        - Estrategia de Server Components/Client Components aún no explícita.
        - Mezcla de `styles.css`, `globals.css` y Tailwind típica de brownfields.
        - No se aprecia todavía una capa clara de patrones de accesibilidad e i18n.

      3.5. Calidad del estado de UI (Redux)

      - Fortalezas:
        - Redux centrado en estado de interfaz, sin almacenar datos de negocio.
        - Slices pequeños y enfocados (`chatPanel`, `menuPanel`, `themeMode`, `emailClipboard`).
      - Observaciones / riesgos:
        - Bugs corregidos recientemente (`menuPanel.toggle`, `themeMode.setThemeMode`) muestran necesidad de tests y cuidado con side-effects en reducers.
        - `themeMode` mezcla persistencia (localStorage), manipulación del DOM y lógica de negocio.

      3.6. Síntesis competitiva

      - Fortalezas competitivas:
        - Arquitectura base sólida para un portfolio moderno.
        - Estructura de carpetas y responsabilidades fácil de explicar y extender.
        - Primeros pasos dados hacia mayor rigor (zod en `profile`, corrección de bugs en Redux y modelos).
      - Áreas claras de mejora frente a proyectos punteros:
        - Rigor en la capa de datos (extender zod, asegurar métodos completos en modelos, clarificar mocks/API).
        - Madurez de la capa de estado de UI (reducir side-effects en reducers, añadir tests mínimos).
        - Aprovechamiento de Next 14 (planificar RSC, SSR/streaming donde aporte valor).
        - Consolidación de un estándar de UX/UI (estilos, a11y, consistencia visual).
      2.1. Entry point y layout global

      - Archivo clave: `src/app/layout.jsx`.
      - Rol: punto de entrada de App Router, aplicación de estilos globales, fuente, RootProvider y layout principal con `NavBar`, `AnimatedChildren` y `Footer`.
      - Consecuencia arquitectónica: toda la aplicación cliente vive bajo un único árbol de providers consistente.

