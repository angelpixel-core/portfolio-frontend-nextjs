      - Cada página compone organismos que:
        - ConsumEN hooks de dominio para datos (por ejemplo, `useExperienceStats`, `useProjects`, `useArticles`).
        - Pueden consultar slices de Redux para comportamiento de UI (menú, tema, chat).
      - El flujo estándar es:
