name: CI

on:
  push:
    branches: [main, development, "feat/", "fix/", "epic/*", "story/*"]
  pull_request:
    branches: [main, development, "feat/", "fix/", "epic/*", "story/*"]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_frontend_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d portfolio_frontend_development"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_frontend_development
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: portfolio_frontend_development
      DB_HOST: localhost
      DB_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_frontend_development
      BETTER_AUTH_URL: http://localhost:9000
      BETTER_AUTH_SECRET: ci-local-better-auth-secret-32chars
      NEXT_PUBLIC_USE_MOCKS: "true"
      NEXT_PUBLIC_OAUTH_ENABLED: "false"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: test-recaptcha-site-key
      RECAPTCHA_SECRET_KEY: test-recaptcha-secret
      RECAPTCHA_MIN_SCORE: "0.5"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

      - name: Run Lighthouse CI
        id: lighthouse
        run: |
          npm install -g @lhci/cli
          lhci autorun 2>&1 | tee lighthouse-output.txt
          echo "## Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -E "performance|accessibility|best-practices|seo" lighthouse-output.txt | head -4 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View full report in the **lighthouse-report** artifact." >> $GITHUB_STEP_SUMMARY

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test environment readiness (CI)
        run: npm run test:env:ci
        env:
          TEST_ENV_AUTO_MIGRATE: "true"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_frontend_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d portfolio_frontend_development"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_frontend_development
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: portfolio_frontend_development
      DB_HOST: localhost
      DB_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_frontend_development
      BETTER_AUTH_URL: http://localhost:9000
      BETTER_AUTH_SECRET: ci-local-better-auth-secret-32chars
      NEXT_PUBLIC_USE_MOCKS: "true"
      NEXT_PUBLIC_OAUTH_ENABLED: "false"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: test-recaptcha-site-key
      RECAPTCHA_SECRET_KEY: test-recaptcha-secret
      RECAPTCHA_MIN_SCORE: "0.5"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test environment readiness (CI)
        run: npm run test:env:ci
        env:
          TEST_ENV_AUTO_MIGRATE: "true"

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          PROFILE_EMAIL: test@ci.local

      # NOTE: Skip-budget gate is temporarily disabled while auth/contact/theme
      # E2E suites are paused. Re-enable once suites are stabilized and waivers
      # are removed.
      # - name: Enforce E2E skip-budget policy
      #   if: ${{ success() }}
      #   run: npm run quality:e2e:skip-budget
      #   env:
      #     E2E_SKIP_BUDGET_MAX: ${{ vars.E2E_SKIP_BUDGET_MAX }}
      #     E2E_SKIP_BREAK_GLASS: ${{ vars.E2E_SKIP_BREAK_GLASS }}
      #     E2E_SKIP_WAIVER_FILE: .github/e2e-skip-waiver.json
      #     E2E_SKIP_REPORT_FILE: test-results/e2e-results.json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            test-results/e2e-results.json
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true # Non-blocking, warning only (per architecture)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_frontend_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d portfolio_frontend_development"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_frontend_development
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: portfolio_frontend_development
      DB_HOST: localhost
      DB_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_frontend_development
      BETTER_AUTH_URL: http://localhost:9000
      BETTER_AUTH_SECRET: ci-local-better-auth-secret-32chars
      NEXT_PUBLIC_USE_MOCKS: "true"
      NEXT_PUBLIC_OAUTH_ENABLED: "false"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: test-recaptcha-site-key
      RECAPTCHA_SECRET_KEY: test-recaptcha-secret
      RECAPTCHA_MIN_SCORE: "0.5"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

