name: CI

on:
  push:
    branches: [main, "epic/*"]
  pull_request:
    branches: [main, "epic/*"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test environment readiness (CI)
        run: npm run test:env:ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Runtime dependency security gate
        run: npm run security:audit:runtime
        env:
          SECURITY_AUDIT_BREAK_GLASS: ${{ vars.SECURITY_AUDIT_BREAK_GLASS }}
          SECURITY_AUDIT_WAIVER_FILE: .github/security-audit-waiver.json

      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test environment readiness (CI)
        run: npm run test:env:ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          PROFILE_EMAIL: test@ci.local

      - name: Enforce E2E skip-budget policy
        if: ${{ success() }}
        run: npm run quality:e2e:skip-budget
        env:
          E2E_SKIP_BUDGET_MAX: ${{ vars.E2E_SKIP_BUDGET_MAX }}
          E2E_SKIP_BREAK_GLASS: ${{ vars.E2E_SKIP_BREAK_GLASS }}
          E2E_SKIP_WAIVER_FILE: .github/e2e-skip-waiver.json
          E2E_SKIP_REPORT_FILE: test-results/e2e-results.json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            test-results/e2e-results.json
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true # Non-blocking, warning only (per architecture)
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

      - name: Run Lighthouse CI
        id: lighthouse
        run: |
          npm install -g @lhci/cli
          lhci autorun 2>&1 | tee lighthouse-output.txt
          # Extract scores from output for summary
          echo "## Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -E "performance|accessibility|best-practices|seo" lighthouse-output.txt | head -4 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View full report in the **lighthouse-report** artifact." >> $GITHUB_STEP_SUMMARY

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  # === STORYBOOK BUILD (future) ===
