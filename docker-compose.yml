# ==============================================================================
# Portfolio Site - Docker Compose (Local Development)
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Web (Next.js)
  # ---------------------------------------------------------------------------
  web:
    image: portfolio-frontend-nextjs-web:dev
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_PORT: ${WEB_PORT:-10301}
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=${WEB_PORT:-10301}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - "${WEB_PORT:-10301}:9000"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Database (PostgreSQL)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    profiles: ["app"]
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-test_db}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./.container/db/init:/docker-entrypoint-initdb.d
      - ./drizzle:/migrations:ro
    ports:
      - "${DB_EXPOSE_PORT:-10302}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    stdin_open: true
    tty: true
    networks:
      - portfolio

  # ---------------------------------------------------------------------------
  # DB Admin (Adminer)
  # ---------------------------------------------------------------------------
  db_admin:
    image: dpage/pgadmin4
    profiles: ["app"]
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${DB_ADMIN_USER:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${DB_ADMIN_PASSWORD:-root}
    ports:
      - "${DB_ADMIN_PORT:-10303}:80"
    depends_on:
      - db
    networks:
      - portfolio

volumes:
  pgdata:

networks:
  portfolio:
    driver: bridge
